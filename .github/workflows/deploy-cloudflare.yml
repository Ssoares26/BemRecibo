name: Deploy no Cloudflare

# Publica o Worker (API + interface) e aplica as migrações do D1.
# Precisa dos secrets CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID;
# sem eles o workflow termina sem publicar (deploy manual continua válido).

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - "frontend/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Rodar testes
        run: npm test

      - name: Aplicar migrações no D1
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler d1 migrations apply bemrecibo --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publicar Worker
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
